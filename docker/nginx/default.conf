server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    # Without this, nginx sends `Content-Type: text/css`/`text/javascript`
    # with no charset param. The files themselves are UTF-8, but browsers
    # can then fall back to a locale-dependent encoding (e.g. Windows-1252)
    # for content that isn't otherwise encoding-tagged — like CSS
    # `content: '...'` strings — corrupting non-ASCII characters (e.g. the
    # breadcrumb separator '›' rendering as 'â€º'). nginx's default
    # charset_types list doesn't include text/css or text/javascript, so
    # `charset utf-8;` alone is silently a no-op for them without this.
    charset utf-8;
    charset_types text/css text/javascript application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Livewire serves its JS/CSS assets dynamically (no file on disk), so it
    # must be routed to PHP instead of being caught by the static-file rule below.
    location ~ ^/livewire-[^/]+/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
