upload_max_filesize = 20M
; Slightly above upload_max_filesize so multi-image product uploads (several
; files in one request) aren't truncated by the overall POST size cap.
post_max_size = 25M
memory_limit = 256M
max_execution_time = 60

; --- Security hardening (OWASP: don't leak stack/version info) ---
; display_errors is intentionally left as PHP's own default here: this ini
; is shared by local dev too, and disabling it would blank-screen fatal
; parse/bootstrap errors that occur before Laravel's own handler can render
; anything. In production, set APP_DEBUG=false (Laravel's own error page)
; and additionally set display_errors=Off in a prod-only php.ini overlay.
expose_php = Off
log_errors = On
